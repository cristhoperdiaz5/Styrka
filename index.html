const ROUTINE = {name:"Fuerza + Hipertrofia · 4 días", days:4, items:[
  {id:"a",ex:"e1",d:1,sets:4,reps:"6-8",rest:150},{id:"b",ex:"e2",d:1,sets:4,reps:"8-10",rest:120,cw:60},

  {id:"h",ex:"e5",d:2,sets:3,reps:"8-10",rest:120},{id:"i",ex:"e9",d:2,sets:3,reps:"12",rest:60},
  {id:"j",ex:"e7",d:3,sets:4,reps:"10-12",rest:120},{id:"k",ex:"e2",d:3,sets:3,reps:"10",rest:90},
  {id:"l",ex:"e6",d:3,sets:3,reps:"10",rest:90},
  {id:"m",ex:"e1",d:4,sets:3,reps:"8",rest:120},{id:"n",ex:"e4",d:4,sets:3,reps:"AMRAP",rest:90},
  {id:"o",ex:"e10",d:4,sets:3,reps:"60s",rest:45},
]};

const MILESTONES=[{d:50,r:"Creatina"},{d:100,r:"Proteína"},{d:150,r:"Playera GymShark"},{d:200,r:"Sudadera YoungLA"}];
const LEVELC={principiante:.55,intermedio:.75,avanzado:.95};
const GOALI={fuerza:.85,musculo:.72,grasa:.65,condicion:.6};
const FEELF={pleno:1,fatiga:.8,enfermo:.5};
const GOALL={musculo:"Ganar músculo",fuerza:"Ganar fuerza",grasa:"Bajar grasa corporal",condicion:"Mejorar condición física"};

const r25 = n => Math.max(2.5, Math.round(n/2.5)*2.5);
const load = (p,ex,feel,cw) => {
  const f = FEELF[feel];
  if(ex.r===0) return {kg:0,pct:Math.round((1-f)*100)};
  if(cw) return {kg:r25(cw*f),pct:Math.round((1-f)*100)};
  const rm=(p.weight||75)*ex.r*LEVELC[p.level||"principiante"];
  return {kg:r25(rm*GOALI[p.goal||"musculo"]*f),pct:Math.round((1-f)*100)};
};
const est1RM=(kg,reps)=>Math.round(kg*(1+reps/30));
const key=d=>d.toISOString().slice(0,10);

function makeAttendance(){
  const out=[];const d=new Date();
  for(let i=0;i<53;i++){out.push(key(d));d.setDate(d.getDate()-1);}
  for(let i=0;i<160;i++){d.setDate(d.getDate()-1);if(Math.random()>.45)out.push(key(d));}
  return out;
}
function streakOf(dates){
  const s=new Set(dates);let n=0;const c=new Date();
  if(!s.has(key(c)))c.setDate(c.getDate()-1);
  while(s.has(key(c))){n++;c.setDate(c.getDate()-1);}
  return n;
}
function grid(dates){
  const s=new Set(dates),end=new Date(),st=new Date(end);
  st.setDate(st.getDate()-364);st.setDate(st.getDate()-st.getDay());
  const w=[],c=new Date(st);
  while(c<=end){const wk=[];for(let i=0;i<7;i++){wk.push({k:key(c),a:s.has(key(c))});c.setDate(c.getDate()+1);}w.push(wk);}
  return w;
}

/* ---------------- UI base ---------------- */

};

const Chip=({children,active,onClick})=>

  cam:"M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8",

  link:"M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1",

              nutricion:Nutricion,coach:Coach,onboarding:Onboarding,pending:Waiting}[screen];

const Head=({eyebrow,title,right})=>
  <header className="flex items-start justify-between mb-6">
    <div>{eyebrow&&<p className="text-muted text-xs mb-1">{eyebrow}</p>}
      <h1 className="text-[28px] leading-none font-bold">{title}</h1></div>{right}</header>;

/* ---------------- Inicio ---------------- */
function Inicio({st}){
  const {me,feel,setFeel,attendance,setScreen}=st;
  const s=streakOf(attendance);
  const next=MILESTONES.find(m=>m.d>s);
  const day=Math.min(((new Date().getDay()+6)%7)+1,ROUTINE.days);
  const today=ROUTINE.items.filter(i=>i.d===day);
  const F=[["pleno","Al 100%"],["fatiga","Con fatiga"],["enfermo","Enfermo"]];

  return <div>
    <Head eyebrow={new Date().toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"})}
      title={"Hola, "+me.name.split(" ")[0]}
      right={<Btn v="ghost" onClick={()=>setScreen("coach")}>Panel coach</Btn>}/>

    <Card className="mb-4 border-brand-500/25">
      <div className="flex items-center gap-2 mb-3">
        <span className="text-brand-500"><Ico d={P.flame} size={22}/></span>
        <span className="text-4xl font-bold leading-none">{s}</span>
        <span className="text-muted text-sm">días seguidos</span></div>
      {next&&<>
        <div className="h-1.5 bg-surface2 rounded-full overflow-hidden mb-2">
          <div className="h-full bg-brand-500 rounded-full" style={{width:Math.min(100,s/next.d*100)+"%"}}/></div>
        <p className="text-xs text-muted">{next.d-s} días para desbloquear <span className="text-txt font-semibold">{next.r}</span></p></>}
    </Card>

    <section className="mb-5">
      <h2 className="text-sm text-muted mb-2.5">¿Cómo te sientes hoy?</h2>
      <div className="flex gap-2">{F.map(([id,l])=><Chip key={id} active={feel===id} onClick={()=>setFeel(id)}>{l}</Chip>)}</div>
      {feel!=="pleno"&&<p className="text-xs text-warn mt-2.5 leading-relaxed">
        Modo adaptado activo: las cargas de hoy bajan {feel==="fatiga"?"20":"50"}%. Si estás enfermo,
        considera descansar en lugar de entrenar.</p>}
    </section>

    <Card className="mb-4">
      <div className="flex items-start justify-between mb-3">
        <div><p className="text-muted text-xs mb-1">Sesión de hoy · Día {day}</p>
          <h3 className="text-lg font-bold leading-tight">{ROUTINE.name}</h3></div>
        <span className="text-brand-500"><Ico d={P.chev} size={22}/></span></div>
      <ul className="space-y-2 mb-4">
        {today.slice(0,4).map(i=><li key={i.id} className="flex justify-between text-sm">
          <span>{byId(i.ex).n}</span><span className="text-muted">{i.sets}×{i.reps}</span></li>)}
        {today.length>4&&<li className="text-xs text-muted">+{today.length-4} ejercicios más</li>}</ul>
      <Btn className="w-full" onClick={()=>setScreen("rutina")}>Empezar entrenamiento</Btn></Card>

    <div className="grid grid-cols-3 gap-3 mb-4">
      <Card className="text-center py-3"><Stat l="Peso" v={me.weight} u="kg"/></Card>
      <Card className="text-center py-3"><Stat l="Frecuencia" v={me.freq} u="d/sem"/></Card>
      <Card className="text-center py-3"><Stat l="Nivel" v={me.level.slice(0,4)}/></Card></div>

    <div className="grid grid-cols-2 gap-3">

        <span className="text-brand-500"><Ico d={P.apple}/></span><span className="text-sm font-semibold">Nutrición</span></Card></button>
      <button onClick={()=>st.setScreen("comunidad")}><Card className="flex items-center gap-3 h-full">

    <button onClick={()=>st.setScreen("onboarding")} className="text-muted text-xs mt-6 underline">

/* ---------------- Rutina ---------------- */
function Rutina({st}){
  const {me,feel,logs,setLogs}=st;
  const [day,setDay]=useState(1);
  const [detail,setDetail]=useState(null);
  const items=ROUTINE.items.filter(i=>i.d===day);
  const total=items.reduce((n,i)=>n+i.sets,0);
  const done=items.reduce((n,i)=>n+((logs[i.id]||[]).filter(x=>x.done).length),0);

  const upd=(k,no,patch)=>setLogs(p=>{
    const l=[...(p[k]||[])],i=l.findIndex(x=>x.no===no);
    if(i>=0)l[i]={...l[i],...patch};else l.push({no,done:false,...patch});
    return {...p,[k]:l};});

  return <div>
    <Head eyebrow={ROUTINE.name} title="Tu rutina"/>
    <div className="flex gap-2 overflow-x-auto pb-1 mb-4">
      {[1,2,3,4].map(d=><Chip key={d} active={day===d} onClick={()=>setDay(d)}>Día {d}</Chip>)}</div>

    <Card className="mb-4 flex items-center justify-between">
      <div><p className="text-muted text-xs">Progreso de la sesión</p>
        <p className="text-2xl font-bold">{done}<span className="text-muted text-base">/{total} series</span></p></div>
      <svg viewBox="0 0 36 36" className="w-16 h-16 -rotate-90">
        <circle cx="18" cy="18" r="15.5" fill="none" stroke="#282C34" strokeWidth="4"/>
        <circle cx="18" cy="18" r="15.5" fill="none" stroke="#D97757" strokeWidth="4" strokeLinecap="round"
          strokeDasharray={(done/(total||1))*97.4+" 97.4"}/></svg></Card>

    {feel!=="pleno"&&<div className="flex gap-2 items-start bg-warn/10 border border-warn/30 rounded-xl p-3 mb-4">
      <span className="text-warn shrink-0 mt-0.5"><Ico d={P.alert} size={16}/></span>
      <p className="text-xs text-warn leading-relaxed">Cargas reducidas por tu check-in de hoy. Prioriza técnica sobre peso.</p></div>}

function Chat({st}){

  ["Salmón con ensalada",450,38,"18 min","150 g salmón al horno, mezcla verde, medio aguacate, vinagreta."]]};
const SUPPS=[["Creatina monohidratada","5 g diarios","El suplemento con más respaldo para fuerza. Sin ciclos ni carga."],

  ["Vitamina D3","1000-2000 UI","Útil si tienes poca exposición solar. Idealmente con análisis previo."]];

function Nutricion({st}){
  const {me}=st;
  const [plan,setPlan]=useState(me.goal==="grasa"?"definicion":"hipertrofia");
  const w=me.weight,kcal=Math.round(plan==="hipertrofia"?w*38:w*28);
  const pr=Math.round(w*(plan==="hipertrofia"?2:2.2)),fat=Math.round(w*.9);
  const cb=Math.round((kcal-pr*4-fat*9)/4);
  return <div>
    <Head eyebrow="Guía dinámica según tu objetivo" title="Nutrición"/>
    <div className="flex gap-2 mb-5">
      <Chip active={plan==="hipertrofia"} onClick={()=>setPlan("hipertrofia")}>Hipertrofia</Chip>
      <Chip active={plan==="definicion"} onClick={()=>setPlan("definicion")}>Pérdida de grasa</Chip></div>
    <Card className="mb-5">
      <p className="text-muted text-xs mb-3">Objetivo diario estimado para {w} kg</p>
      <div className="grid grid-cols-4 gap-2 mb-4">
        <Stat l="Calorías" v={kcal}/><Stat l="Proteína" v={pr} u="g"/>
        <Stat l="Carbos" v={cb} u="g"/><Stat l="Grasa" v={fat} u="g"/></div>
      <div className="flex h-2 rounded-full overflow-hidden">
        <div className="bg-brand-500" style={{width:(pr*4/kcal*100)+"%"}}/>
        <div className="bg-brand-400" style={{width:(cb*4/kcal*100)+"%"}}/>
        <div className="bg-warn" style={{width:(fat*9/kcal*100)+"%"}}/></div>
      <p className="text-[11px] text-muted mt-3 leading-relaxed">
        Estimación general. Ajusta con tu coach según cómo evolucione tu peso semana a semana.</p></Card>
    <h2 className="text-sm text-muted mb-3">Recetas rápidas</h2>
    <div className="space-y-3 mb-5">{RECIPES[plan].map(([n,k,p,t,h])=>
      <Card key={n}><div className="flex justify-between items-start mb-2">
        <h3 className="font-bold text-sm leading-tight flex-1">{n}</h3>
        <span className="text-[11px] text-muted ml-3">{t}</span></div>
        <p className="text-xs text-muted leading-relaxed mb-2.5">{h}</p>
        <div className="flex gap-4 text-[11px]"><span className="text-brand-500 font-semibold">{k} kcal</span>
          <span className="text-muted">{p} g proteína</span></div></Card>)}</div>
    <h2 className="text-sm text-muted mb-3">Suplementación</h2>
    <div className="space-y-2">{SUPPS.map(([n,d,x])=>
      <Card key={n} className="py-3"><div className="flex justify-between items-baseline mb-1">
        <h3 className="text-sm font-semibold">{n}</h3><span className="text-[11px] text-brand-500">{d}</span></div>
        <p className="text-[11px] text-muted leading-relaxed">{x}</p></Card>)}</div>
    <p className="text-[11px] text-muted mt-4 leading-relaxed">
      Esta guía es orientativa. Si tienes una condición médica, tomas medicamentos o estás embarazada,
      consulta a un profesional de la salud antes de cambiar tu alimentación o empezar suplementos.</p>
  </div>;
}

        <div className="flex items-start gap-3 mb-3.5">
          <div className="w-10 h-10 rounded-full bg-brand-500/15 text-brand-500 grid place-items-center font-bold">{c.name[0]}</div>
          <div className="flex-1"><h3 className="font-bold leading-tight">{c.name}</h3>
            <p className="text-muted text-xs mt-1">{GOALL[c.goal]} · {c.level} · {c.freq} d/sem</p>
            <p className="text-muted text-xs mt-0.5">{c.weight} kg · Lesiones: {c.injuries.join(", ")}</p></div></div>
        <div className="flex gap-2">
          <Btn v="ok" className="flex-1" onClick={()=>{setClients(x=>[...x,c]);setPending(p=>p.filter(y=>y.id!==c.id));}}>Aprobar</Btn>
          <Btn v="danger" className="flex-1" onClick={()=>setPending(p=>p.filter(y=>y.id!==c.id))}>Rechazar</Btn></div></Card>)}</div>}

    {tab==="cli"&&<div className="space-y-3">{clients.map(c=>
      <Card key={c.id}><div className="flex items-center gap-3">
        <div className="w-10 h-10 rounded-full bg-surface2 grid place-items-center font-bold">{c.name[0]}</div>
        <div className="flex-1 min-w-0"><h3 className="font-bold leading-tight truncate">{c.name}</h3>
          <p className="text-muted text-xs mt-1">Racha {streakOf(attendance)} d · {GOALL[c.goal]}</p></div></div>
        <div className="flex gap-2 mt-3.5">
          <Btn v="ghost" className="flex-1" onClick={()=>setDetail(c)}>Ver actividad</Btn>
          <Btn className="flex-1" onClick={()=>setAssign(c)}>Asignar rutina</Btn></div></Card>)}</div>}

    <Sheet open={!!detail} onClose={()=>setDetail(null)} title={detail?detail.name:""}>
      {detail&&<div className="space-y-5">
        <div className="grid grid-cols-3 gap-3">
          <Card className="py-3"><Stat l="Peso" v={detail.weight} u="kg"/></Card>
          <Card className="py-3"><Stat l="Racha" v={streakOf(attendance)} u="d"/></Card>
          <Card className="py-3"><Stat l="Sesiones" v={attendance.length}/></Card></div>
        <section><h3 className="text-sm text-muted mb-2.5">Últimos registros de series</h3>
          <div className="space-y-2">{[["Sentadilla con barra","4×6 · 90 kg",8,"Ayer"],
            ["Press banca","4×8 · 60 kg",7,"Ayer"],["Peso muerto","4×5 · 120 kg",9,"Hace 2 días"]].map(([n,s,rpe,w])=>
            <Card key={n} className="py-3 flex items-center justify-between">
              <div><p className="text-sm font-semibold leading-tight">{n}</p>
                <p className="text-[11px] text-muted mt-0.5">{s} · {w}</p></div>
              <span className={"text-xs font-semibold "+(rpe>=9?"text-warn":"text-ok")}>RPE {rpe}</span></Card>)}</div></section>
        <section><h3 className="text-sm text-muted mb-2.5">Historial de pesajes</h3>
          <Card className="py-3"><div className="flex items-end gap-2 h-20">
            {[82,81,80,79,78.5,78].map((w,i)=><div key={i} className="flex-1 flex flex-col items-center gap-1">
              <span className="text-[9px] text-muted">{w}</span>
              <div className="w-full bg-brand-500/60 rounded-t" style={{height:((w-76)/7*100)+"%"}}/></div>)}</div></Card></section>
        <section><h3 className="text-sm text-muted mb-2">Salud declarada</h3>
          <p className="text-sm">Lesiones: <span className="text-brand-400">{detail.injuries.join(", ")}</span></p>
          <p className="text-xs text-muted mt-1.5">Reportó fatiga 2 de los últimos 7 días. Las cargas se
            redujeron automáticamente esos días.</p></section></div>}</Sheet>

    <Sheet open={!!assign} onClose={()=>setAssign(null)} title="Asignar rutina">
      {assign&&<AssignForm c={assign} close={()=>setAssign(null)}/>}</Sheet>
  </div>;
}

function AssignForm({c,close}){
  const [name,setName]=useState("Plan "+c.name.split(" ")[0]);
  const [days,setDays]=useState(4);
  const [pick,setPick]=useState(["e1","e2","e6"]);
  const [saved,setSaved]=useState(false);
  if(saved) return <div className="text-center py-8">
    <div className="w-14 h-14 rounded-full bg-ok/15 grid place-items-center mx-auto mb-4 text-ok"><Ico d={P.check} size={26}/></div>
    <h3 className="font-bold text-lg mb-2">Rutina asignada</h3>
    <p className="text-muted text-sm leading-relaxed mb-6">{c.name} verá <span className="text-txt">{name}</span> en
      su pestaña Rutina la próxima vez que abra la app.</p>
    <Btn className="w-full" onClick={close}>Listo</Btn></div>;
  return <div className="space-y-5">
    <div><label className="block text-sm text-muted mb-2">Nombre del plan</label>
      <input value={name} onChange={e=>setName(e.target.value)} className="w-full"/></div>
    <div><label className="block text-sm text-muted mb-2.5">Días por semana</label>
      <div className="flex gap-2">{[2,3,4,5,6].map(n=>
        <button key={n} onClick={()=>setDays(n)} className={"flex-1 py-2.5 rounded-lg text-sm font-semibold border "+
          (days===n?"bg-brand-500 text-bg border-brand-500":"bg-surface2 text-muted border-line")}>{n}</button>)}</div></div>
    <div><label className="block text-sm text-muted mb-2.5">Ejercicios <span className="text-txt">({pick.length})</span></label>
      <div className="space-y-1.5 max-h-64 overflow-y-auto">{EX.map(e=>{
        const on=pick.includes(e.id),risky=e.c.some(x=>c.injuries.includes(x));
        return <button key={e.id} onClick={()=>setPick(p=>on?p.filter(x=>x!==e.id):[...p,e.id])}
          className={"w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border text-left "+
            (on?"border-brand-500 bg-brand-500/10":"border-line bg-surface")}>
          <span className={on?"text-brand-500":"text-muted"}><Ico d={P.dumb} size={15}/></span>
          <div className="flex-1 min-w-0"><p className="text-sm font-semibold leading-tight truncate">{e.n}</p>
            <p className="text-[11px] text-muted">{e.g}</p></div>
          {risky&&<span className="text-[10px] text-warn">Riesgo</span>}</button>;})}</div></div>
    <Btn className="w-full" disabled={!pick.length} onClick={()=>setSaved(true)}>
      Asignar a {c.name.split(" ")[0]}</Btn></div>;
}

/* ---------------- Onboarding ---------------- */
const INJ=[["rodilla","Rodilla"],["hombro","Hombro"],["espalda_baja","Espalda baja"],["muneca_codo","Muñeca / codo"],
  ["cadera","Cadera"],["tobillo_pie","Tobillo / pie"],["articular_general","Molestia articular"],["ninguna","Ninguna"]];
const LVL=[["principiante","Principiante","Menos de 6 meses entrenando"],
  ["intermedio","Intermedio","6 meses a 2 años"],["avanzado","Avanzado","Más de 2 años constante"]];

function Onboarding({st}){
  const {setMe,setScreen}=st;
  const [s,setS]=useState(0);
  const [d,setD]=useState({name:"",gender:"",birth:"",weight:"",height:"",goal:"",level:"",inj:[],freq:3});
  const set=p=>setD(x=>({...x,...p}));
  const ok=[d.name.trim(),d.gender&&d.birth,d.weight&&d.height,d.goal,d.inj.length,d.level][s];
  const toggle=id=>set({inj:id==="ninguna"?["ninguna"]:d.inj.includes(id)?d.inj.filter(i=>i!==id):[...d.inj.filter(i=>i!=="ninguna"),id]});

  return <div className="min-h-screen flex flex-col">
    <div className="flex items-center gap-3 mb-8">
      <button onClick={()=>s>0?setS(s-1):setScreen("inicio")} className="text-muted"><Ico d={P.back} size={22}/></button>
      <div className="flex-1 h-1 bg-surface2 rounded-full overflow-hidden">
        <div className="h-full bg-brand-500 rounded-full" style={{width:((s+1)/6*100)+"%"}}/></div>
      <span className="text-muted text-xs">{s+1}/6</span></div>

    <div className="flex-1">
      {s===0&&<Step t="¿Cómo te gusta que te digan?" sub="Así te llamaremos en la app.">
        <input autoFocus value={d.name} onChange={e=>set({name:e.target.value})} placeholder="Tu nombre" className="w-full text-lg"/></Step>}
      {s===1&&<Step t="Cuéntanos de ti" sub="Esto ajusta tus cargas iniciales.">
        <label className="block text-sm text-muted mb-2">Género</label>
        <div className="flex gap-2 mb-6">{["masculino","femenino","otro"].map(g=>
          <Chip key={g} active={d.gender===g} onClick={()=>set({gender:g})}>{g[0].toUpperCase()+g.slice(1)}</Chip>)}</div>
        <label className="block text-sm text-muted mb-2">Fecha de nacimiento</label>
        <input type="date" value={d.birth} onChange={e=>set({birth:e.target.value})} className="w-full"/></Step>}
      {s===2&&<Step t="Tus medidas" sub="Podrás actualizarlas cuando quieras.">
        <div className="grid grid-cols-2 gap-4">
          <div><label className="block text-sm text-muted mb-2">Peso (kg)</label>
            <input type="number" inputMode="decimal" value={d.weight} onChange={e=>set({weight:e.target.value})} placeholder="75" className="w-full"/></div>
          <div><label className="block text-sm text-muted mb-2">Altura (cm)</label>
            <input type="number" inputMode="numeric" value={d.height} onChange={e=>set({height:e.target.value})} placeholder="175" className="w-full"/></div></div></Step>}
      {s===3&&<Step t="¿Cuál es tu objetivo principal?" sub="Define la intensidad de tu plan.">
        <div className="space-y-2.5">{Object.entries(GOALL).map(([id,l])=>
          <button key={id} onClick={()=>set({goal:id})} className={"w-full text-left px-4 py-3.5 rounded-xl border "+
            (d.goal===id?"border-brand-500 bg-brand-500/10":"border-line bg-surface")}>
            <span className="font-semibold">{l}</span></button>)}</div></Step>}
      {s===4&&<Step t="¿Tienes alguna lesión o molestia?" sub="Filtraremos ejercicios de riesgo y avisaremos a tu coach.">
        <div className="flex flex-wrap gap-2">{INJ.map(([id,l])=>
          <Chip key={id} active={d.inj.includes(id)} onClick={()=>toggle(id)}>{l}</Chip>)}</div>
        <p className="text-[11px] text-muted mt-4 leading-relaxed">Esto no sustituye una valoración médica.
          Si tienes dolor persistente, consulta a un fisioterapeuta o médico antes de entrenar esa zona.</p></Step>}
      {s===5&&<Step t="Tu experiencia y disponibilidad" sub="Último paso.">
        <div className="space-y-2.5 mb-7">{LVL.map(([id,l,h])=>
          <button key={id} onClick={()=>set({level:id})} className={"w-full text-left px-4 py-3 rounded-xl border "+
            (d.level===id?"border-brand-500 bg-brand-500/10":"border-line bg-surface")}>
            <p className="font-semibold text-sm">{l}</p><p className="text-muted text-xs mt-0.5">{h}</p></button>)}</div>
        <label className="block text-sm text-muted mb-3">Días por semana: <span className="text-txt font-semibold">{d.freq}</span></label>
        <div className="flex gap-2">{[1,2,3,4,5,6,7].map(n=>
          <button key={n} onClick={()=>set({freq:n})} className={"flex-1 py-2.5 rounded-lg text-sm font-semibold border "+
            (d.freq===n?"bg-brand-500 text-bg border-brand-500":"bg-surface2 text-muted border-line")}>{n}</button>)}</div></Step>}
    </div>

    <Btn className="w-full mt-8" disabled={!ok} onClick={()=>{
      if(s<5){setS(s+1);return;}
      setMe(m=>({...m,name:d.name,weight:Number(d.weight),height:Number(d.height),
        goal:d.goal,level:d.level,freq:d.freq,injuries:d.inj}));
      setScreen("pending");}}>
      {s===5?"Enviar solicitud a mi coach":"Continuar"}</Btn>
  </div>;
}
const Step=({t,sub,children})=><div>
  <h1 className="text-[26px] font-bold leading-tight mb-2">{t}</h1>
  {sub&&<p className="text-muted text-sm mb-7">{sub}</p>}{children}</div>;

/* ---------------- Espera ---------------- */
function Waiting({st}){
  return <div className="min-h-screen flex flex-col justify-center">
    <div className="w-16 h-16 rounded-2xl bg-brand-500/15 grid place-items-center mb-6 text-brand-500">
      <Ico d={P.cal} size={28}/></div>
    <h1 className="text-[28px] font-bold leading-tight mb-3">Estamos revisando tu registro</h1>
    <p className="text-muted leading-relaxed mb-8">Tu coach recibió la solicitud. En cuanto la apruebe,
      tu rutina aparecerá aquí automáticamente y podrás empezar a entrenar.</p>
    <Card className="mb-8"><ul className="space-y-3.5">
      {[[1,"Perfil completado"],[1,"Solicitud enviada a tu coach"],[0,"Aprobación del coach"],[0,"Rutina asignada"]].map(([done,l])=>
        <li key={l} className="flex items-center gap-3">
          <span className={"w-5 h-5 rounded-full grid place-items-center "+(done?"bg-ok text-bg":"border border-line")}>
            {done?<Ico d={P.check} size={12}/>:null}</span>
          <span className={"text-sm "+(done?"":"text-muted")}>{l}</span></li>)}</ul></Card>
    <Btn v="ghost" className="w-full" onClick={()=>st.setScreen("inicio")}>Volver a la app</Btn>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
